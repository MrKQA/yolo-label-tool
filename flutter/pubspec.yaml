name: yolo_label_tool
description: A Flutter frontend for the YOLO labeling and training tool.
publish_to: "none"

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  file_selector: ^1.0.4
  fl_chart: ^0.69.2
  flex_color_picker: ^3.8.0
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.11.1
  video_player: ^2.11.1
  video_player_win: ^3.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/language/
